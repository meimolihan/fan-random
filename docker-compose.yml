services:
  fan-random:
    build: .
    image: mobufan/fan-random:latest
    container_name: fan-random
    restart: always
    volumes:
      - ./public/pc:/fan-random/public/pc             # pc 桌面端壁纸目录（横屏）
      - ./public/mp:/fan-random/public/mp             # mp 移动端壁纸目录（竖屏）
      - ./photos:/fan-random/photos                       # 原始图片目录
    ports:
      - 8588:3000
    environment:
      - TZ=Asia/Shanghai
      - PORT=3000
      # 对外访问地址（可选，用于启动日志显示；留空则显示 http://0.0.0.0:端口）
      - PUBLIC_HOST=http://your-domain.com:8588